[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysillaprism"
version = "0.1.0"
description = "Transport-agnostic client library for the Silla Prism EV wallbox over MQTT"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ermanno Baschiera", email = "ebaschiera@gmail.com" }]
keywords = ["silla", "prism", "wallbox", "evse", "ev-charger", "mqtt", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ebaschiera/pysillaprism"
Source = "https://github.com/ebaschiera/pysillaprism"
Issues = "https://github.com/ebaschiera/pysillaprism/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pysillaprism"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=pysillaprism --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
